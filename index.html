<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3D Gaussian Splatting Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a1a;
            font-family: system-ui, sans-serif;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 100;
        }
        #info h1 { font-size: 16px; margin-bottom: 5px; }
        #info p { opacity: 0.7; font-size: 12px; }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            z-index: 50;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>3DGS Viewer</h1>
        <p>Drag to rotate | Scroll to zoom | Right-drag to pan</p>
    </div>
    <div id="loading">Loading model...</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.2/build/gaussian-splats-3d.module.js"
        }
    }
    </script>

    <script type="module">
        import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

        // Model file in same directory - supports .ply, .splat, or .ksplat
        const MODEL_FILE = 'model.splat';

        const viewer = new GaussianSplats3D.Viewer({
            cameraUp: [0, 1, 0],
            initialCameraPosition: [0, 0, 5],
            initialCameraLookAt: [0, 0, 0],
            sharedMemoryForWorkers: false
        });

        viewer.addSplatScene(MODEL_FILE, {
            splatAlphaRemovalThreshold: 5,
            showLoadingUI: true,
            position: [0, 0, 0],
            rotation: [0, 0, 0, 1],
            scale: [1, 1, 1]
        })
        .then(() => {
            document.getElementById('loading').style.display = 'none';
            viewer.start();
        })
        .catch((error) => {
            document.getElementById('loading').textContent = 'Error loading model: ' + error.message;
            console.error('Failed to load model:', error);
        });
    </script>
</body>
</html>
